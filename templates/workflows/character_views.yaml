id: character_views
type: character_views
name: H3 辅助四视图生成流（Krea2 架构，主图派生）
file: character_views.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '24'
    field: prompt
  params:
    seed:
      node: '14'
      field: seed
    width:
      node: '7'
      field: width
    height:
      node: '7'
      field: height
  images:
  - node: '17'
    field: image
    slot: body
outputs:
- node: '5'
  filename_prefix: cs/{project}/{asset}
requires:
- comfyui-krea2edit
- comfyui-kjnodes

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '25', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '21', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae, node: '9', field: vae_name, cls: VAELoader, label_cn: VAE}
- {label: lora_quadview, node: '16', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 三视图 LoRA}
