id: h3_fl2v
type: fl2v
name: MiniMax H3 首尾帧生视频（2026-09-18 新链）
file: h3_fl2v.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '64'
    field: prompt
  params:
    seed:
      node: '51'
      field: seed
    duration:
      node: '60'
      field: value
    aspect:
      node: '58'
      field: aspect_ratio
    megapixels:
      node: '58'
      field: megapixels
    multiple:
      node: '58'
      field: multiple
    steps:
      node: '53'
      field: steps
    # H3 SLA 注意力三键（2026-09-10 起；2026-09-18 新链 SLA 仍为最后一环，
    # 前环换 MiniMaxChunkFeedForward）。block_size 新接口是 INT
    h3_sla_enabled:
      node: '83'
      field: enabled
    h3_sla_sparsity:
      node: '83'
      field: sparsity_ratio
    h3_sla_block_size:
      node: '83'
      field: block_size
  images:
  - node: '47'
    field: image
    slot: first
  - node: '48'
    field: image
    slot: last
outputs:
- node: '68'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF
- comfyui-kjnodes

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）。
# 2026-09-18 新链：LoRA 换 LazyH3LoraStack 多槽开关栈（switch=启用_N 语义：
# 非空=设名+开、空串=只关、未覆盖=模板默认）。模板内置（用户验证组合）：
# L1 真实电影质感 / L2 Motion_Repair / L3 H3_Combat_V2 开、L4 旧 SLA turbo 关、
# L5 taomate 3步 开（底模已 fused turbo8，4 步采样）
models:
- {label: unet, node: '39', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '41', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae_video, node: '42', field: vae_name, cls: VAELoader, label_cn: 视频 VAE}
- {label: vae_audio, node: '46', field: vae_name, cls: VAELoader, label_cn: 音频 VAE}
- {label: lora1, node: '78', field: LoRA_1, cls: LazyH3LoraStack, switch: 启用_1, label_cn: LoRA 槽 1}
- {label: lora2, node: '78', field: LoRA_2, cls: LazyH3LoraStack, switch: 启用_2, label_cn: LoRA 槽 2}
- {label: lora3, node: '78', field: LoRA_3, cls: LazyH3LoraStack, switch: 启用_3, label_cn: LoRA 槽 3}
- {label: lora4, node: '78', field: LoRA_4, cls: LazyH3LoraStack, switch: 启用_4, label_cn: LoRA 槽 4}
- {label: lora5, node: '78', field: LoRA_5, cls: LazyH3LoraStack, switch: 启用_5, label_cn: LoRA 槽 5}
- {label: lora6, node: '78', field: LoRA_6, cls: LazyH3LoraStack, switch: 启用_6, label_cn: LoRA 槽 6}
- {label: lora7, node: '78', field: LoRA_7, cls: LazyH3LoraStack, switch: 启用_7, label_cn: LoRA 槽 7}
- {label: lora8, node: '78', field: LoRA_8, cls: LazyH3LoraStack, switch: 启用_8, label_cn: LoRA 槽 8}
