id: h3_fl2v
type: fl2v
name: MiniMax H3 首尾帧生视频（P4）
file: h3_fl2v.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '64'
    field: prompt
  params:
    seed:
      node: '51'
      field: seed
    duration:
      node: '60'
      field: value
  images:
  - node: '47'
    field: image
    slot: first
  - node: '48'
    field: image
    slot: last
outputs:
- node: '68'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF
- comfyui-kjnodes

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '39', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '41', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae_video, node: '42', field: vae_name, cls: VAELoader, label_cn: 视频 VAE}
- {label: vae_audio, node: '46', field: vae_name, cls: VAELoader, label_cn: 音频 VAE}
- {label: lora_realism, node: '25', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 真实感 LoRA}
- {label: lora_turbo, node: '26', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 加速 LoRA}
