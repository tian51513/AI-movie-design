id: h3_i2v
type: i2v
name: MiniMax H3 图生视频（首帧）
file: h3_i2v.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '55'
    field: prompt
  params:
    duration:
      node: '59'
      field: value
    aspect:
      node: '54'
      field: aspect_ratio
    megapixels:
      node: '54'
      field: megapixels
    multiple:
      node: '54'
      field: multiple
    steps:
      node: '48'
      field: steps
    seed:
      node: '51'
      field: seed
    # H3 SLA 注意力（2026-09-10 用户自定义节点）：settings 三键注入，
    # 模板缺该节点声明时 filler 自动忽略（旧模板可共存）
    h3_sla_enabled:
      node: '72'
      field: enabled
    h3_sla_sparsity:
      node: '72'
      field: sparsity_ratio
    h3_sla_block_size:
      node: '72'
      field: block_size
    sage_attention:   # SLA 联动（2026-09-10）：SLA 开→disabled 防注意力双实现叠加（T8 禁令），SLA 关→auto 回稠密基线
      node: '31'
      field: sage_attention
    lora_turbo_name:   # SLA 联动（2026-09-10）：开关各配蒸馏匹配版——开=SLA 版/
      # 关=普通 turbo（历史基线）；设置页手动选过 lora_turbo 槽则不注入（手动优先）
      node: '26'
      field: lora_name
  images:
  - node: '53'
    field: image
    slot: first
outputs:
- node: '63'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF
- comfyui-kjnodes

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '52', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '40', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae_audio, node: '46', field: vae_name, cls: VAELoader, label_cn: 音频 VAE}
- {label: vae_video, node: '45', field: vae_name, cls: VAELoader, label_cn: 视频 VAE}
- {label: lora_realism, node: '25', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 真实感 LoRA}
- {label: lora_turbo, node: '26', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 加速 LoRA}
