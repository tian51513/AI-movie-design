id: h3_i2v
type: i2v
name: MiniMax H3 图生视频（首帧）
file: h3_i2v.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '55'
    field: prompt
  params:
    duration:
      node: '59'
      field: value
    aspect:
      node: '54'
      field: aspect_ratio
    megapixels:
      node: '54'
      field: megapixels
    multiple:
      node: '54'
      field: multiple
    steps:
      node: '48'
      field: steps
    seed:
      node: '51'
      field: seed
  images:
  - node: '53'
    field: image
    slot: first
outputs:
- node: '63'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF
- comfyui-kjnodes

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '52', field: unet_name, cls: UNETLoader}
- {label: clip, node: '40', field: clip_name, cls: CLIPLoader}
- {label: vae_audio, node: '46', field: vae_name, cls: VAELoader}
- {label: vae_video, node: '45', field: vae_name, cls: VAELoader}
