id: h3_ref2va
type: ref2va
name: MiniMax H3 多参考生视频（P4 主力）
file: h3_ref2va.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '110'
    field: prompt
  params:
    seed:
      node: '105'
      field: seed
    duration:
      node: '109'
      field: value
    aspect:
      node: '116'
      field: aspect_ratio
    megapixels:
      node: '116'
      field: megapixels
    multiple:
      node: '116'
      field: multiple
    steps:
      node: '101'
      field: steps
    lora_strength:
      node: '117'
      field: strength_model
    # H3 SLA 注意力（2026-09-10 用户自定义节点）：settings 三键注入，
    # 模板缺该节点声明时 filler 自动忽略（旧模板可共存）
    h3_sla_enabled:
      node: '130'
      field: enabled
    h3_sla_sparsity:
      node: '130'
      field: sparsity_ratio
    h3_sla_block_size:
      node: '130'
      field: block_size
    sage_attention:   # SLA 联动（2026-09-10）：SLA 开→disabled 防注意力双实现叠加（T8 禁令），SLA 关→auto 回稠密基线
      node: '123'
      field: sage_attention
    lora_turbo_name:   # SLA 联动（2026-09-10）：开关各配蒸馏匹配版——开=SLA 版/
      # 关=普通 turbo（历史基线）；设置页手动选过 lora_turbo 槽则不注入（手动优先）
      node: '118'
      field: lora_name
  images:
  - node: '96'
    field: image
    slot: ref0
  - node: '97'
    field: image
    slot: ref1
  # Phase 2 音色（2026-08-30）：说话人样本 LoadAudio 上传位（后缀分流 → /upload/audio）
  - node: '95'
    field: audio
    slot: audio0
  - node: '98'
    field: audio
    slot: audio1
outputs:
- node: '114'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF
- comfyui-kjnodes

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '90', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '92', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae_audio, node: '93', field: vae_name, cls: VAELoader, label_cn: 音频 VAE}
- {label: vae_video, node: '94', field: vae_name, cls: VAELoader, label_cn: 视频 VAE}
- {label: lora_realism, node: '117', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 真实感 LoRA}
- {label: lora_turbo, node: '118', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 加速 LoRA}
