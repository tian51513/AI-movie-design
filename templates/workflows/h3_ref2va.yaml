id: h3_ref2va
type: ref2va
name: MiniMax H3 多参考生视频（P4 主力）
file: h3_ref2va.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '110'
    field: prompt
  params:
    seed:
      node: '105'
      field: seed
    duration:
      node: '109'
      field: value
    aspect:
      node: '116'
      field: aspect_ratio
    megapixels:
      node: '116'
      field: megapixels
    multiple:
      node: '116'
      field: multiple
    steps:
      node: '101'
      field: steps
    lora_strength:
      node: '117'
      field: strength_model
  images:
  - node: '96'
    field: image
    slot: ref0
  - node: '97'
    field: image
    slot: ref1
outputs:
- node: '114'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF
- comfyui-kjnodes

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '90', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '92', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae_audio, node: '93', field: vae_name, cls: VAELoader, label_cn: 音频 VAE}
- {label: vae_video, node: '94', field: vae_name, cls: VAELoader, label_cn: 视频 VAE}
- {label: lora_realism, node: '117', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 真实感 LoRA}
- {label: lora_turbo, node: '118', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 加速 LoRA}
