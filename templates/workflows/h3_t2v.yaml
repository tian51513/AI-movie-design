id: h3_t2v
type: t2v
name: MiniMax H3 文生视频（P4 可选）
file: h3_t2v.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '9'
    field: prompt
  params:
    seed:
      node: '12'
      field: seed
    duration:
      node: '16'
      field: value
    aspect:
      node: '6'
      field: aspect_ratio
    megapixels:
      node: '6'
      field: megapixels
    multiple:
      node: '6'
      field: multiple
    steps:
      node: '15'
      field: steps
    # H3 SLA 注意力（2026-09-10 用户自定义节点）：settings 三键注入，
    # 模板缺声明时 filler 自动忽略（旧模板可共存）
    h3_sla_enabled:
      node: '38'
      field: enabled
    h3_sla_sparsity:
      node: '38'
      field: sparsity_ratio
    h3_sla_block_size:
      node: '38'
      field: block_size
    sage_attention:   # SLA 联动（2026-09-10）：SLA 开→disabled 防注意力双实现叠加（T8 禁令），SLA 关→auto 回稠密基线
      node: '31'
      field: sage_attention
outputs:
- node: '20'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '4', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '3', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae_audio, node: '8', field: vae_name, cls: VAELoader, label_cn: 音频 VAE}
- {label: vae_video, node: '1', field: vae_name, cls: VAELoader, label_cn: 视频 VAE}
- {label: lora_realism, node: '25', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 真实感 LoRA}
- {label: lora_turbo, node: '26', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 加速 LoRA}
