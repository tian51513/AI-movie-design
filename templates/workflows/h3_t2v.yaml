id: h3_t2v
type: t2v
name: MiniMax H3 文生视频（P4 可选）
file: h3_t2v.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '9'
    field: prompt
  params:
    seed:
      node: '12'
      field: seed
    duration:
      node: '16'
      field: value
    aspect:
      node: '6'
      field: aspect_ratio
    megapixels:
      node: '6'
      field: megapixels
    multiple:
      node: '6'
      field: multiple
    steps:
      node: '15'
      field: steps
outputs:
- node: '20'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-GGUF

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: unet, node: '4', field: unet_name, cls: UNETLoader}
- {label: clip, node: '3', field: clip_name, cls: CLIPLoader}
- {label: vae_audio, node: '8', field: vae_name, cls: VAELoader}
- {label: vae_video, node: '1', field: vae_name, cls: VAELoader}
