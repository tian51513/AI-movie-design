id: qwen21_edit
type: t2i
name: Qwen-Image 2.1 图片编辑（改版·双参考）
file: qwen21_edit.api.json
prompt_format: '{detail}'
# 提示词扩写（2026-09-22 用户实测：2.1 短提示出不了好效果——提交前经 LLM
# 扩写为细节丰富长文，锚定约束全保留，失败回落原文）。模式 edit = 官方
# Qwen-Image-2.1 编辑规范流（属性解耦+整段保留条款；官方规则正文随用户
# 语言=恒中文）
prompt_expand: edit
inject:
  prompt:
    node: '487'
    field: prompt
  params:
    seed: {node: '484', field: seed}
    steps: {node: '484', field: steps}
    width: {node: '482', field: width}
    height: {node: '482', field: height}
  # 漫画页参考道契约（comic_page_ref 位）：char1/char2 两槽进编码器
  # images.image_1/2（引擎多传的 scene/canvas 槽无声明即忽略——场景走文字锚，
  # 2.1 编辑是参考条件化范式、无 latent 底）。模型原生支持至多 10 参考图，
  # 编码器输入自增长（images.image_N）——后续多角色镜可扩槽
  images:
  - {node: '476', field: image, slot: char1}
  - {node: '477', field: image, slot: char2}
outputs:
- node: '461'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-Easy-Use
- ComfyUI_Lazybuxuexi   # LazyKreaLoraStack 8 LoRA 槽（2026-10-01 用户需求）
# 来源 _raw/Qwen-image-2.1图像编辑改版.json（用户 2026-09-21 实测可用）。
# ComfySwitchNode.switch=False 恒编辑模式；QwenImage21Cache 模型缓存；
# easy cleanGpuUsed 跑完清显存。改造同 t2i（删 ResolutionSelector/核心 Save）。
# 编辑耗时基线 ~60s/张（25 步无加速 LoRA——2.1 Lightning 实测画质不行，用户判例）。
models:
- {label: unet, node: '479', field: unet_name, cls: UNETLoader, label_cn: 主模型（Qwen2.1 int8）}
- {label: clip, node: '480', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器（qwen3vl 8b）}
- {label: vae, node: '481', field: vae_name, cls: VAELoader, label_cn: VAE}

# 8 LoRA 开关槽（2026-10-01，同 qwen21_t2i）：串在 UNETLoader 与
# QwenImage21Cache 之间（LoRA 挂底模、cache 缓存挂好的模型）
- {label: lora1, node: '478', field: LoRA_1, cls: LazyKreaLoraStack, switch: 启用_1, label_cn: LoRA 1}
- {label: lora2, node: '478', field: LoRA_2, cls: LazyKreaLoraStack, switch: 启用_2, label_cn: LoRA 2}
- {label: lora3, node: '478', field: LoRA_3, cls: LazyKreaLoraStack, switch: 启用_3, label_cn: LoRA 3}
- {label: lora4, node: '478', field: LoRA_4, cls: LazyKreaLoraStack, switch: 启用_4, label_cn: LoRA 4}
- {label: lora5, node: '478', field: LoRA_5, cls: LazyKreaLoraStack, switch: 启用_5, label_cn: LoRA 5}
- {label: lora6, node: '478', field: LoRA_6, cls: LazyKreaLoraStack, switch: 启用_6, label_cn: LoRA 6}
- {label: lora7, node: '478', field: LoRA_7, cls: LazyKreaLoraStack, switch: 启用_7, label_cn: LoRA 7}
- {label: lora8, node: '478', field: LoRA_8, cls: LazyKreaLoraStack, switch: 启用_8, label_cn: LoRA 8}
