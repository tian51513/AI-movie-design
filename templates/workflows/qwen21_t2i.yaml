id: qwen21_t2i
type: t2i
name: Qwen-Image 2.1 文生图（改版·2026-09-21 接入）
file: qwen21_t2i.api.json
prompt_format: '{detail}'
# 提示词扩写（2026-09-22 用户实测：2.1 短提示出不了好效果——提交前经 LLM
# 扩写为细节丰富长文，锚定约束全保留，失败回落原文）。模式 t2i = 官方
# Qwen-Image-2.1 8 步观察者流（语言随 settings comfy.prompt_expand_lang，
# 默认中文，可切英文 A/B）
prompt_expand: t2i
inject:
  prompt:
    node: '469'
    field: prompt
  params:
    seed: {node: '474', field: seed}
    steps: {node: '474', field: steps}
    width: {node: '472', field: width}
    height: {node: '472', field: height}
outputs:
- node: '461'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI_Lazybuxuexi   # LazyKreaLoraStack 8 LoRA 槽（2026-10-01 用户需求）
# 来源 _raw/Qwen-image-2.1文生图改版.json（用户 2026-09-21 实测可用）。
# 改造：删 ResolutionSelector（宽高直注 EmptyLatent）；SaveImageAdvanced→核心
# SaveImage（免自定义节点依赖）。cfg=1/euler/simple 为 2.1 蒸馏配方勿动。
# 注意：2.1 的 Lightning LoRA 实测画质不达标（用户判例 2026-09-21）——不加
# 加速开关，步数走 template_params。
models:
- {label: unet, node: '468', field: unet_name, cls: UNETLoader, label_cn: 主模型（Qwen2.1 int8）}
- {label: clip, node: '470', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器（qwen3vl 8b）}
- {label: vae, node: '471', field: vae_name, cls: VAELoader, label_cn: VAE}

# 8 LoRA 开关槽（2026-10-01）：槽默认 none 全空=原味不加 LoRA——设置页模型
# 切换区选文件自动开；「（关闭）」=只关开关。注意：栈只挂 UNet 链，qwen3vl
# 编码器不走 LoRA；2.1 Lightning 画质判例仍成立（默认不加速）
- {label: lora1, node: '475', field: LoRA_1, cls: LazyKreaLoraStack, switch: 启用_1, label_cn: LoRA 1}
- {label: lora2, node: '475', field: LoRA_2, cls: LazyKreaLoraStack, switch: 启用_2, label_cn: LoRA 2}
- {label: lora3, node: '475', field: LoRA_3, cls: LazyKreaLoraStack, switch: 启用_3, label_cn: LoRA 3}
- {label: lora4, node: '475', field: LoRA_4, cls: LazyKreaLoraStack, switch: 启用_4, label_cn: LoRA 4}
- {label: lora5, node: '475', field: LoRA_5, cls: LazyKreaLoraStack, switch: 启用_5, label_cn: LoRA 5}
- {label: lora6, node: '475', field: LoRA_6, cls: LazyKreaLoraStack, switch: 启用_6, label_cn: LoRA 6}
- {label: lora7, node: '475', field: LoRA_7, cls: LazyKreaLoraStack, switch: 启用_7, label_cn: LoRA 7}
- {label: lora8, node: '475', field: LoRA_8, cls: LazyKreaLoraStack, switch: 启用_8, label_cn: LoRA 8}
