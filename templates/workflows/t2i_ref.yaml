id: t2i_ref
type: t2i
name: 文生图参考（小枫/majicmix）
file: t2i_ref.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '10:6'
    field: text
  params:
    seed:
      node: '10:3'
      field: seed
    width:
      node: '10:5'
      field: width
    height:
      node: '10:5'
      field: height
outputs:
- node: '11'
  filename_prefix: cs/{project}/{asset}
requires: []
prompt_style: tags_en

# 模型槽位（settings model_overrides 按模板 id → {label: 文件名} 覆盖）
models:
- {label: ckpt, node: '12', field: ckpt_name, cls: CheckpointLoaderSimple, label_cn: 整合模型 Checkpoint}
