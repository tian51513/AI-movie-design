id: zimage_page_redraw
type: i2i
name: Z-Image 整页重绘（线稿 ControlNet 结构锁 + 自由风格化，2026-09-11 v3）
file: zimage_page_redraw.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '28'
    field: value
  params:
    seed:
      node: '4'
      field: seed
    # v3（2026-09-11）：ControlNet 锁结构后 denoise=1.0 全幅生成——构图/人数
    # 由线稿条件保证（v2 纯 latent i2i 在漫画→真人跨域下 0.55 仍改人数）
    denoise:
      node: '4'
      field: denoise
    aspect:
      node: '58'
      field: aspect_ratio
    megapixels:
      node: '58'
      field: megapixels
    multiple:
      node: '58'
      field: multiple
  # base=原页：链内 AnimeLineArtPreprocessor 提线稿→Resize 到项目画幅→
  # Qwen-Image Fun-Union ControlNet（lineart 型，strength 0.85）锁构图，
  # 画风/质感全交提示词自由发挥——manga→photo 跨域的标准解
  images:
  - node: '23'
    field: image
    slot: base
outputs:
- node: '10'
  filename_prefix: cs/{project}/{asset}
requires:
- comfyui-kjnodes
- comfyui_controlnet_aux

models:
- {label: unet, node: '1', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '2', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae, node: '3', field: vae_name, cls: VAELoader, label_cn: VAE}
- {label: control_net, node: '141', field: control_net_name, cls: ControlNetLoader, label_cn: 结构控制 ControlNet}
