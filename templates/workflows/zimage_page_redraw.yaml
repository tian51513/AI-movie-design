id: zimage_page_redraw
type: i2i
name: Z-Image 整页重绘（原页底图 i2i + 主图 rembg→IP-Adapter 身份锚）
file: zimage_page_redraw.api.json
prompt_format: '{kind_label}：{name}。{detail}'
inject:
  prompt:
    node: '28'
    field: value
  params:
    seed:
      node: '4'
      field: seed
    # 2026-09-10 真机四修：0.75 构图只剩 25% latent（原页差异大根因③）
    # ——0.55 保构图/人物位置，转风仍够力度；settings comfy.page_redraw_denoise 可调
    denoise:
      node: '4'
      field: denoise
  # 双图槽：base=原页（VAEEncode 底图保构图）；char_ref=角色主图（rembg 抠背景
  # → easy ipadapterApply PLUS 身份注入——修复「角色与主图差别大」根因①）
  images:
  - node: '23'
    field: image
    slot: base
  - node: '100'
    field: image
    slot: char_ref
outputs:
- node: '10'
  filename_prefix: cs/{project}/{asset}
requires:
- ComfyUI-Easy-Use
- comfyui-rembg

# 采样机制（2026-09-10 用户 _raw 实测定稿）：Z-Image turbo 按 cfg=1 蒸馏——
# 旧 zimage_i2i 的 cfg=5+euler 是过度烹煮（根因④）；res_multistep+simple 为
# turbo 推荐采样器；负条件走 ConditioningZeroOut（turbo 惯例）
models:
- {label: unet, node: '1', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet}
- {label: clip, node: '2', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器 CLIP}
- {label: vae, node: '3', field: vae_name, cls: VAELoader, label_cn: VAE}
