id: zimage_page_ref
type: t2i
name: 漫画页角色参考（Edit-2511 多图人物场景化 + Lightning 4 步，2026-09-13 二期 v1.1）
file: zimage_page_ref.api.json
prompt_format: '{detail}'
inject:
  prompt:
    node: '28'
    field: value
  params:
    seed: {node: '4', field: seed}
    steps: {node: '4', field: steps}
    denoise: {node: '4', field: denoise}
    cfg: {node: '4', field: cfg}
    lightning_strength: {node: '9001', field: strength_model}
    width: {node: '45', field: width}
    height: {node: '45', field: height}
  # 多图槽（2511 原生 1-3 参考拼接编辑）：char1 主角色主图（同时 Resize→
  # VAEEncode 作 latent 底）；char2 第二角色主图；scene 场景参考图。缺省槽
  # 由 handler 上传白图占位（提示词不提图号即被模型忽略）
  images:
  - {node: '23', field: image, slot: char1}
  - {node: '24', field: image, slot: char2}
  - {node: '25', field: image, slot: scene}
  - {node: '26', field: image, slot: canvas}
outputs:
- node: '10'
  filename_prefix: cs/{project}/{asset}
requires:
- comfyui-kjnodes
models:
- {label: unet, node: '1', field: unet_name, cls: UNETLoader, label_cn: 主模型 UNet（Edit-2511）}
- {label: clip, node: '2', field: clip_name, cls: CLIPLoader, label_cn: 文本编码器（qwen2.5-vl）}
- {label: vae, node: '3', field: vae_name, cls: VAELoader, label_cn: VAE（qwen_image_vae）}
- {label: lightning, node: '9001', field: lora_name, cls: LoraLoaderModelOnly, label_cn: 加速 LoRA（Lightning 4 步；设空文件=关闭走质量档步数）}

# v1.3（2026-09-13 真机判例·底图锁死）：latent 底改空白画布（26→45→1085）——
# 旧版 char1 主图直作 latent 底，Edit「保持一致」把构图（半身照）与风格（主图
# 摄影风）一并锁死，分镜描述/画风词与底图拔河（换风格输出几乎不变）。
# 现参考图只走 Plus 编码器做身份条件，denoise 1.0 纯生成按描述+画风重构图。
#
# 二期 v1.1（2026-09-13 分析报告落地，docs/2026-09-13-comic-workflow-analysis.md）：
# 2511 多图（官方多人合照一致性强化）——char1+char2 双角色真参考注入；
# Lightning 4 步（strength=comfy.page_ref_lightning 默认 1.0，设 0 关闭）；
# cfg=comfy.page_ref_cfg 默认 2.5（Lightning 蒸馏下真机调）；scene 槽留 v1.2
# 场景参考图注入。提示词按实际图号引用（「图1的人物与图2的人物…」）。
